<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PAWER</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d1a;
      touch-action: none;
    }
    #game-container {
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container canvas { display: block; }

    /* ── Rotate overlay ── */
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      z-index: 9999;
      color: #ffffff;
      font-family: Arial, sans-serif;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 18px;
    }
    #rotate-msg .phone-icon {
      font-size: 72px;
      display: inline-block;
      animation: rotate-hint 1.6s ease-in-out infinite;
    }
    #rotate-msg h2 { font-size: clamp(20px, 5vw, 28px); font-weight: bold; }
    #rotate-msg p  { font-size: clamp(13px, 3vw, 17px); opacity: 0.65; }
    @keyframes rotate-hint {
      0%  { transform: rotate(0deg);  }
      35% { transform: rotate(90deg); }
      65% { transform: rotate(90deg); }
      100%{ transform: rotate(0deg);  }
    }
    @media (orientation: portrait) and (hover: none) {
      #rotate-msg     { display: flex; }
      #game-container { display: none; }
    }

    /* ── Hide Google Translate toolbar ── */
    .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
    #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
  </style>
</head>
<body>
  <div id="rotate-msg">
    <span class="phone-icon">📱</span>
    <h2>סובב את המכשיר</h2>
    <p>PAWER עובד בצורה הטובה ביותר במצב לרוחב</p>
  </div>

  <!-- Hidden Google Translate widget -->
  <div id="google_translate_element" style="display:none;position:fixed;top:0;left:0;z-index:0"></div>

  <div id="game-container"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="js/network/Network.js?v=1"></script>
  <script src="js/ui/MobileControls.js?v=1"></script>
  <script src="js/scenes/PreloadScene.js?v=8"></script>
<script src="js/scenes/SetupScene.js?v=2"></script>
  <script src="js/scenes/MenuScene.js?v=13"></script>
  <script src="js/scenes/GameScene.js?v=15"></script>
  <script src="js/scenes/SoccerScene.js?v=19"></script>
  <script src="js/main.js?v=12"></script>
  <script>
    if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(() => {});
  </script>

  <!-- Google Translate init -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'iw', autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE },
        'google_translate_element'
      );
    }

    window.PAWER_setLang = function(code) {
      (function attempt() {
        var sel = document.querySelector('.goog-te-combo');
        if (!sel) { setTimeout(attempt, 400); return; }
        sel.value = code;
        sel.dispatchEvent(new Event('change'));
        localStorage.setItem('pawer_lang', code);
      })();
    };

    // Restore saved language on reload
    (function() {
      var saved = localStorage.getItem('pawer_lang');
      if (!saved) return;
      (function attempt() {
        var sel = document.querySelector('.goog-te-combo');
        if (!sel) { setTimeout(attempt, 500); return; }
        sel.value = saved;
        sel.dispatchEvent(new Event('change'));
      })();
    })();
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
